name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            App/package-lock.json
            Api/package-lock.json
      - run: npm ci && npm run lint && npm run test:unit && npm run build
        working-directory: App
      - run: npm ci && npm run prisma:validate && npm run typecheck && npm run test:unit && npm run build
        working-directory: Api
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retail_pos_ci?schema=public
          JWT_SECRET: ci-only-jwt-secret-not-for-production-2026
